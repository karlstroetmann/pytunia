name: publish

# Publishes pytunia on PyPI whenever a release is published on GitHub.
# The release tag must be "v" followed by the version in
# pytunia/__init__.py, e.g. "v0.1".
#
# The upload uses PyPI's trusted publishing: on pypi.org this repository,
# this workflow (publish.yml) and the environment "pypi" are registered as
# the publisher of the project pytunia, so no API token is needed.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pytunia and its dependencies
        run: python -m pip install -e .
      - name: Check that the release tag matches the version
        run: |
          version=$(python -c "import pytunia; print(pytunia.__version__)")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The release tag $GITHUB_REF_NAME does not match the version $version (expected v$version)"
            exit 1
          fi
      - name: Run the tests
        run: python -m unittest discover -s tests
      - name: Build and check the distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pytunia/
    permissions:
      id-token: write   # needed for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
