name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Python 3.9 (the system Python of macOS) is no longer available for
    # the newest Ubuntu image
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the tests
        run: python -m unittest discover -s tests -v
